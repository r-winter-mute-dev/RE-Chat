  <path d="M212 174 L240 202" stroke="#a6e3a1" stroke-width="12" stroke-linecap="round"/>
  <circle cx="190" cy="152" r="12" fill="#a6e3a1" opacity="0.35"/>
  <text x="318" y="190" font-family="Atkinson Hyperlegible, Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="#e6e6e6"><tspan fill="#a6e3a1">RE:</tspan>Chat</text>
  <text x="322" y="244" font-family="Atkinson Hyperlegible, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#a0a0a0">OSINT und digitale Forensik für Chat-Exporte</text>
  <rect x="322" y="270" width="510" height="38" rx="19" fill="none" stroke="#a6e3a1" stroke-width="2"/>
