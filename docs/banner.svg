      <stop offset="0" stop-color="#121212"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#verlauf)"/>
  <rect width="1200" height="360" rx="24" fill="url(#raster)"/>
  <!-- Leiterbahnen -->
